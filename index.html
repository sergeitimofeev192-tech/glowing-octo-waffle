<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Своя игра: Казахское ханство XVI века</title>
<style>
:root{--bg:#eef3f5;--ink:#12303d;--card:#fff;--line:#c5d6dc;--gold:#a8780a;--blue:#1f6f8b;--hd:#1f6f8b;--hdi:#fff;--cell:#14506a;--celli:#ffe08a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2a36;--ink:#eaf2f4;--card:#173a49;--line:#2b5668;--gold:#e3b341;--blue:#6cc3de;--hd:#2b5668;--cell:#1f6f8b;--celli:#fff1b8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f2a36;--ink:#eaf2f4;--card:#173a49;--line:#2b5668;--gold:#e3b341;--blue:#6cc3de;--hd:#2b5668;--cell:#1f6f8b;--celli:#fff1b8;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:28px;line-height:1.15;margin:6px 0 8px}
p{margin:0 0 12px}
.sub{color:var(--blue);font-size:15px}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--card);border:1.5px solid var(--blue);border-radius:8px;padding:11px 12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.main{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:bold;width:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.main{color:#10242e}}
input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px;width:100%;margin:0 0 8px}
.row{display:flex;gap:8px;margin:0 0 12px}.row button{flex:1}
.row button.on{background:var(--blue);color:#fff}
.score{display:flex;gap:6px;margin:0 0 10px}
.team{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:13px;line-height:1.2;overflow:hidden}
.team b{display:block;font-size:22px;color:var(--gold)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.board .h{background:var(--hd);color:var(--hdi,var(--ink));font-size:12px;line-height:1.2;font-weight:bold;padding:8px 3px;border-radius:6px;text-align:center;display:flex;align-items:center;justify-content:center;min-height:62px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .board .h{color:#fff}}
.board button{background:var(--cell);color:var(--celli);border:0;font-size:20px;font-weight:bold;padding:0;min-height:56px}
.board button[disabled]{background:var(--line);color:transparent;cursor:default}
.q{background:var(--card);border:1.5px solid var(--blue);border-radius:10px;padding:16px;margin:10px 0}
.q small{color:var(--blue);font-size:14px}
.q h2{font-size:21px;line-height:1.3;margin:6px 0 12px}
.ans{font-size:20px;color:var(--gold);font-weight:bold;margin:8px 0 4px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.who .none{grid-column:1/-1}
.big{font-size:40px;font-weight:bold;color:var(--gold)}
</style></head>
<body><main id="app"></main>
<script>
var CATS=[
{n:"Хакназар-хан",q:[
["Сыном какого хана был Хакназар?","Касым-хана"],
["В какие годы правил Хакназар-хан?","1538–1580"],
["Что на время удалось Хакназару сделать с казахскими землями?","Объединить под единой властью хана"],
["Кто стал ханом после смерти Хакназара в 1580 г.?","Шигай-хан"],
["За контроль над какими торговыми городами на Сырдарье шла борьба?","Сыгнак, Сауран, Туркестан и другие города Сырдарьи"]]},
{n:"Шайбаниды",q:[
["Какая династия правила Мавераннахром в XVI веке?","Шайбаниды"],
["Кто был самым сильным правителем Шайбанидов в конце XVI в.?","Абдулла-хан II"],
["Какой город был главным центром державы Абдуллы II?","Бухара"],
["В каком году умер Абдулла-хан II?","1598"],
["Какая династия пришла к власти в Бухаре после Шайбанидов?","Аштарханиды (Джаниды)"]]},
{n:"Казахско-русские отношения",q:[
["Как называлось государство на севере, с которым складывались связи?","Русское (Московское) государство"],
["Кто был русским царём в 1570-х годах?","Иван IV Грозный"],
["Какой казахский хан отправил посольство в Москву в 1594 г.?","Тауекель-хан"],
["Как звали сибирского хана, с которым воевали русские в конце XVI в.?","Кучум"],
["Какой царь правил Русским государством в 1594 г.?","Фёдор Иванович"]]},
{n:"События 1598–1599",q:[
["Какой хан в 1598 г. повёл поход в Мавераннахр?","Тауекель-хан"],
["Какие два города заняли казахи в 1598 г.?","Ташкент и Самарканд"],
["К какому городу двинулись казахи после Самарканда?","К Бухаре"],
["Чем кончились бои 1599 г. для казахского войска?","Поражением, хан Тауекель погиб"],
["Кто занял ханский престол после Тауекеля?","Есим-хан"]]}];
var app=document.getElementById("app"),teams,used,cur,n=2;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function setup(){
app.innerHTML='<h1>Своя игра</h1><p class="sub">Казахское ханство во второй половине XVI века</p><p>4 темы, вопросы от 100 до 500 баллов. Команды по очереди выбирают тему и цену. Правильный ответ добавляет очки команде.</p><p><b>Сколько команд?</b></p><div class="row" id="cnt"></div><div id="names"></div><button class="main" id="go">Начать игру</button>';
var cnt=document.getElementById("cnt");
[2,3,4].forEach(function(k){var b=document.createElement("button");b.textContent=k;if(k==n)b.className="on";b.onclick=function(){n=k;setup()};cnt.appendChild(b)});
var h="";for(var i=0;i<n;i++)h+='<input aria-label="Название команды '+(i+1)+'" placeholder="Команда '+(i+1)+'" maxlength="16">';
document.getElementById("names").innerHTML=h;
document.getElementById("go").onclick=function(){var ins=document.querySelectorAll("#names input");teams=[];for(var i=0;i<n;i++)teams.push({name:ins[i].value.trim()||"Команда "+(i+1),pts:0});used={};cur=0;board()}}
function sc(){return '<div class="score">'+teams.map(function(t,i){return '<div class="team" style="'+(i==cur?'border-color:var(--gold)':'')+'">'+esc(t.name)+'<b>'+t.pts+'</b></div>'}).join("")+'</div>'}
function board(){
var left=20-Object.keys(used).length;if(!left)return fin();
var h=sc()+'<p class="sub" style="margin-bottom:8px">Выбирает: <b>'+esc(teams[cur].name)+'</b></p><div class="board">';
CATS.forEach(function(c){h+='<div class="h">'+c.n+'</div>'});
for(var r=0;r<5;r++)CATS.forEach(function(c,ci){var k=ci+"-"+r;h+='<button data-k="'+k+'" '+(used[k]?'disabled':'')+' aria-label="'+c.n+' '+(r+1)*100+'">'+(r+1)*100+'</button>'});
h+='</div>';app.innerHTML=h;
Array.prototype.forEach.call(app.querySelectorAll(".board button"),function(b){b.onclick=function(){ask(b.dataset.k)}})}
function ask(k){var p=k.split("-"),c=CATS[p[0]],r=+p[1],q=c.q[r],pts=(r+1)*100;
app.innerHTML=sc()+'<div class="q"><small>'+c.n+' за '+pts+'</small><h2>'+q[0]+'</h2><div id="a"><button class="main" id="sh">Показать ответ</button></div></div>';
document.getElementById("sh").onclick=function(){
var w='<div class="ans">'+q[1]+'</div><p class="sub">Кто ответил верно?</p><div class="who">';
teams.forEach(function(t,i){w+='<button data-i="'+i+'">'+esc(t.name)+' +'+pts+'</button>'});
w+='<button class="none" data-i="-1">Никто не ответил</button></div>';
document.getElementById("a").innerHTML=w;
Array.prototype.forEach.call(document.querySelectorAll(".who button"),function(b){b.onclick=function(){var i=+b.dataset.i;used[k]=1;if(i>=0){teams[i].pts+=pts;cur=i}else cur=(cur+1)%teams.length;board()}})}}
function fin(){
var s=teams.slice().sort(function(a,b){return b.pts-a.pts}),top=s[0].pts;
var win=s.filter(function(t){return t.pts==top}).map(function(t){return esc(t.name)}).join(" и ");
app.innerHTML='<h1>Игра окончена</h1><div class="q"><small>'+(s.filter(function(t){return t.pts==top}).length>1?'Ничья':'Победитель')+'</small><div class="big">'+win+'</div><p>'+top+' баллов</p></div>'+sc().replace(/border-color:var\(--gold\)/,"")+'<button class="main" id="again">Играть заново</button>';
document.getElementById("again").onclick=setup}
setup();
</script></body></html>
